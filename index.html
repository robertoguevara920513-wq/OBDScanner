<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBD Scanner PRO Diagnóstico</title><style>
body{background:#0b0e13;color:#fff;font-family:Arial;margin:0}main{max-width:650px;margin:auto;padding:18px}.card{background:#161b23;padding:16px;border-radius:16px;margin:12px 0}button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:10px;font-weight:bold}pre{white-space:pre-wrap;word-break:break-word;background:#080a0e;padding:12px;border-radius:10px;min-height:180px}.v{text-align:center;font-size:36px;font-weight:bold}</style><main><h1>OBD SCANNER PRO</h1><div class="card"><div id="st">🔵 DESCONECTADO</div><button id="con">CONECTAR ESP32</button><button id="ping" disabled>PING</button><button id="status" disabled>ESTADO</button></div><div class="card"><button id="ati" disabled>PROBAR ATI</button><button id="at1" disabled>PROBAR AT@1</button><button id="rpm" disabled>PROBAR RPM (010C)</button><div id="rv" class="v">— RPM</div></div><div class="card"><b>Registro</b><pre id="log"></pre></div></main><script>
const S="6e400001-b5a3-f393-e0a9-e50e24dcca9e",R="6e400002-b5a3-f393-e0a9-e50e24dcca9e",T="6e400003-b5a3-f393-e0a9-e50e24dcca9e";let rx=null,tx=null,d=null;const $=x=>document.getElementById(x),log=x=>{$("log").textContent+=x+"\\n"};async function send(x){if(!rx)return;await rx.writeValue(new TextEncoder().encode(x));log("iPhone → "+x)}
$("con").onclick=async()=>{try{if(!navigator.bluetooth)throw Error("Web Bluetooth no disponible; revisa beacio");d=await navigator.bluetooth.requestDevice({filters:[{services:[S]}],optionalServices:[S]});log("Encontrado: "+d.name);let g=await d.gatt.connect(),s=await g.getPrimaryService(S);rx=await s.getCharacteristic(R);tx=await s.getCharacteristic(T);await tx.startNotifications();tx.addEventListener("characteristicvaluechanged",e=>{let x=new TextDecoder().decode(e.target.value);log("ESP32 → "+x);try{let o=JSON.parse(x);if(o.type=="rpm_test")$("rv").textContent=(o.ok?Math.round(o.rpm):"—")+" RPM"}catch{}});$("st").textContent="🟢 ESP32 CONECTADO";["ping","status","ati","at1","rpm"].forEach(x=>$(x).disabled=false);log("BLE conectado.")}catch(e){$("st").textContent="🔴 ERROR";log("ERROR: "+e.message)}};$("ping").onclick=()=>send("PING");$("status").onclick=()=>send("STATUS");$("ati").onclick=()=>send("ATI");$("at1").onclick=()=>send("AT@1");$("rpm").onclick=()=>send("TESTRPM");
</script>
