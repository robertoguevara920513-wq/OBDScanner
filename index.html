<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBD Scanner PRO</title><style>
body{margin:0;background:#0b0e13;color:white;font-family:Arial}main{max-width:700px;margin:auto;padding:18px}
h1{text-align:center}.card{background:#161b23;border-radius:18px;padding:16px;margin:12px 0}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-weight:bold}
#connect{background:#22c55e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{text-align:center;background:#0d1117;padding:14px;border-radius:12px}.v{font-size:30px;font-weight:bold}
label{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2b313b}pre{white-space:pre-wrap;min-height:100px;background:#080a0e;padding:12px;border-radius:10px}
</style></head><body><main><h1>OBD SCANNER PRO</h1>
<div class="card"><div id="st">🔵 DESCONECTADO</div><button id="connect">CONECTAR ESP32</button><button id="ping" disabled>ENVIAR PING</button></div>
<div class="card"><b>PARÁMETROS ACTIVOS</b>
<label>RPM <input id="r" type="checkbox" checked></label><label>Velocidad <input id="s" type="checkbox"></label><label>Temperatura <input id="c" type="checkbox"></label></div>
<div class="card"><div class="grid"><div class="m"><div id="rv" class="v">—</div>RPM</div><div class="m"><div id="sv" class="v">—</div>km/h</div><div class="m"><div id="cv" class="v">—</div>°C</div></div></div>
<div class="card"><b>Registro</b><pre id="log"></pre></div></main>
<script>
const S="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";let d,rx,tx;
const $=x=>document.getElementById(x),log=x=>{$("log").textContent+=x+"\\n"};
async function send(x){if(rx){await rx.writeValue(new TextEncoder().encode(x));log("iPhone → "+x)}}
function params(){send("PARAMS:"+($("r").checked?"1":"0")+($("s").checked?"1":"0")+($("c").checked?"1":"0"))}
$("connect").onclick=async()=>{try{if(!navigator.bluetooth)throw Error("Web Bluetooth no disponible; revisa beacio");d=await navigator.bluetooth.requestDevice({filters:[{services:[S]}],optionalServices:[S]});log("Encontrado: "+d.name);let g=await d.gatt.connect(),svc=await g.getPrimaryService(S);rx=await svc.getCharacteristic(RX);tx=await svc.getCharacteristic(TX);await tx.startNotifications();tx.addEventListener("characteristicvaluechanged",e=>{let x=new TextDecoder().decode(e.target.value);log("ESP32 → "+x);try{let o=JSON.parse(x);if(o.type=="telemetry"){if(o.rpmOk)$("rv").textContent=Math.round(o.rpm);if(o.speedOk)$("sv").textContent=Math.round(o.speed);if(o.coolantOk)$("cv").textContent=Math.round(o.coolant)}}catch{}});$("st").textContent="🟢 ESP32 CONECTADO";$("ping").disabled=false;params()}catch(e){$("st").textContent="🔴 ERROR";log("ERROR: "+e.message)}};
$("ping").onclick=()=>send("PING");$("r").onchange=params;$("s").onchange=params;$("c").onchange=params;
</script></body></html>
