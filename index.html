<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OBD SCANNER PRO V3.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c10;color:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}
h1{text-align:center;color:#1489ee;font-size:30px}.card{background:#171c24;border:1px solid #283241;border-radius:28px;padding:20px;margin:16px 0}
button{width:100%;border:0;border-radius:20px;padding:18px;margin:8px 0;background:#eef0f3;color:#087fe5;font-weight:800;font-size:20px}
.value{text-align:center;font-size:52px;font-weight:800;margin:14px 0}.small{color:#aeb7c3}.ok{color:#55e08a}.bad{color:#ff6878}
.log{background:#05070a;border-radius:20px;padding:18px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:15px;min-height:180px}
</style></head><body>
<h1>OBD SCANNER PRO</h1>
<div class="card">
<button id="connect">CONECTAR ESP32</button><button id="ping">PING</button>
<button id="status">STATUS</button><button id="reconnect">RECONEXIÓN TCP</button>
</div>
<div class="card">
<button id="ati">PROBAR ATI</button><button id="at1">PROBAR AT@1</button>
<button id="rawrpm">PROBAR RPM (010C)</button><button id="test">TESTRPM</button>
</div>
<div class="card"><div>Último RPM válido</div><div id="rpm" class="value">—</div>
<div id="info" class="small">Esperando prueba...</div></div>
<div class="card"><b style="font-size:22px">Registro</b><div id="log" class="log">Listo.</div></div>
<script>
const N="OBD-SCANNER-PRO",S="6e400001-b5a3-f393-e0a9-e50e24dcca9e",
R="6e400002-b5a3-f393-e0a9-e50e24dcca9e",T="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
let rx=null,tx=null;
function log(s){let e=document.getElementById("log");e.textContent+=(e.textContent?"\n":"")+s;e.scrollTop=e.scrollHeight}
function send(s){if(!rx){log("❌ BLE no conectado");return}rx.writeValue(new TextEncoder().encode(s));log("iPhone → "+s)}
function msg(e){
 let s=new TextDecoder().decode(e.target.value);log("ESP32 → "+s);
 try{let j=JSON.parse(s);
  if(j.type==="rpm_test"&&j.ok){document.getElementById("rpm").textContent=Math.round(j.rpm)+" RPM";
   document.getElementById("info").textContent="A="+j.A.toString(16).padStart(2,"0").toUpperCase()+"  B="+j.B.toString(16).padStart(2,"0").toUpperCase()+" · "+j.totalMs+" ms";
   document.getElementById("info").className="small ok"}
  if(j.type==="elm"&&j.cmd==="010C"){
   let m=j.raw.match(/41\s+0C\s+([0-9A-Fa-f]{2})\s+([0-9A-Fa-f]{2})/);
   if(m){let a=parseInt(m[1],16),b=parseInt(m[2],16),v=((a*256)+b)/4;
    document.getElementById("rpm").textContent=Math.round(v)+" RPM";
    document.getElementById("info").textContent="Respuesta directa · "+j.totalMs+" ms";
    document.getElementById("info").className="small ok"}
  }
 }catch(_){}
}
async function connect(){
 log("Buscando "+N+"...");
 try{let d=await navigator.bluetooth.requestDevice({filters:[{name:N}],optionalServices:[S]});
 log("Encontrado: "+d.name);d.addEventListener("gattserverdisconnected",()=>{log("BLE desconectado");rx=tx=null});
 let g=await d.gatt.connect(),svc=await g.getPrimaryService(S);rx=await svc.getCharacteristic(R);tx=await svc.getCharacteristic(T);
 await tx.startNotifications();tx.addEventListener("characteristicvaluechanged",msg);log("BLE listo.")
 }catch(e){log("❌ "+e)}
}
document.getElementById("connect").onclick=connect;
document.getElementById("ping").onclick=()=>send("PING");
document.getElementById("status").onclick=()=>send("STATUS");
document.getElementById("reconnect").onclick=()=>send("RECONNECT");
document.getElementById("ati").onclick=()=>send("ATI");
document.getElementById("at1").onclick=()=>send("AT@1");
document.getElementById("rawrpm").onclick=()=>send("010C");
document.getElementById("test").onclick=()=>send("TESTRPM");
if(!navigator.bluetooth)log("⚠️ Usa Safari + beacio.");
</script></body></html>
