<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OBD Scanner PRO - TCP V3</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#fff;font-family:Arial,sans-serif}main{max-width:700px;margin:auto;padding:18px}h1{text-align:center;margin:8px 0 2px}.sub{text-align:center;color:#8993a2;margin-bottom:18px}.card{background:#171c24;border:1px solid #272e39;border-radius:18px;padding:16px;margin:12px 0}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;font-size:16px;font-weight:bold;background:#e7e8eb;color:#0782e8}.green{background:#22c55e;color:#061008}.status{padding:13px;border-radius:12px;background:#0f141b;text-align:center;font-weight:bold}pre{white-space:pre-wrap;word-break:break-word;background:#080a0e;padding:13px;border-radius:12px;min-height:220px;font-size:12px;line-height:1.45}.value{font-size:38px;text-align:center;font-weight:bold}</style></head><body><main><h1>OBD SCANNER PRO</h1><div class="sub">DIAGNOSTICO TCP ELM327 V3</div><div class="card"><div id="status" class="status">🔵 DESCONECTADO</div><button id="connect" class="green">CONECTAR ESP32</button></div><div class="card"><button id="ping" disabled>PING</button><button id="statusBtn" disabled>STATUS</button><button id="reconnect" disabled>RECONEXION TCP</button></div><div class="card"><button id="ati" disabled>PROBAR ATI</button><button id="at1" disabled>PROBAR AT@1</button><button id="rpm" disabled>PROBAR RPM (010C)</button><button id="testRpm" disabled>TESTRPM</button></div><div class="card"><div>Ultimo RPM valido</div><div id="rpmValue" class="value">—</div></div><div class="card"><b>Registro</b><pre id="log"></pre></div></main><script>const S="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";let d=null,rx=null,tx=null;const $=id=>document.getElementById(id);function log(x){let e=$("log");e.textContent+=x+"\n";e.scrollTop=e.scrollHeight}function en(v){["ping","statusBtn","reconnect","ati","at1","rpm","testRpm"].forEach(id=>$(id).disabled=!v)}async function send(x){if(!rx)return log("BLE no conectado");await rx.writeValue(new TextEncoder().encode(x));log("iPhone → "+x)}$("connect").onclick=async()=>{try{if(!navigator.bluetooth)throw Error("navigator.bluetooth no disponible; revisa beacio");log("Buscando OBD-SCANNER-PRO...");d=await navigator.bluetooth.requestDevice({filters:[{services:[S]}],optionalServices:[S]});log("Encontrado: "+(d.name||"sin nombre"));d.addEventListener("gattserverdisconnected",()=>{en(false);$("status").textContent="🔵 DESCONECTADO";log("BLE desconectado")});let g=await d.gatt.connect(),svc=await g.getPrimaryService(S);rx=await svc.getCharacteristic(RX);tx=await svc.getCharacteristic(TX);await tx.startNotifications();tx.addEventListener("characteristicvaluechanged",e=>{let m=new TextDecoder().decode(e.target.value);log("ESP32 → "+m);try{let o=JSON.parse(m);if(o.type==="rpm_test"&&o.ok)$("rpmValue").textContent=Math.round(o.rpm)+" RPM"}catch{}});$("status").textContent="🟢 ESP32 CONECTADO";en(true);log("BLE listo.")}catch(e){$("status").textContent="🔴 ERROR";log("ERROR: "+e.message)}};$("ping").onclick=()=>send("PING");$("statusBtn").onclick=()=>send("STATUS");$("reconnect").onclick=()=>send("RECONNECT");$("ati").onclick=()=>send("ATI");$("at1").onclick=()=>send("AT@1");$("rpm").onclick=()=>send("010C");$("testRpm").onclick=()=>send("TESTRPM");</script></body></html>
